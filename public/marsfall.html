async function checkHold(){try{const s=await rpc('get_status'),g=(s&&s.game)||{},on=!!g.on&&!G&&!$('#again');$('#hold').hidden=!on;app.hidden=on;if(on)$('#hm').textContent=g.message||'The mission portal opens soon. Please wait.'}catch(e){}}
if(matchMedia('(prefers-reduced-motion:reduce)').matches)document.querySelectorAll('#hold animate,#hold animateMotion,#hold animateTransform').forEach(a=>a.remove());
landing();checkHold();setInterval(checkHold,15000);
(()=>{const L=['Calibrating thrusters','Aligning orbit','Stabilising signal','Syncing mission data'],rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let last='';
 setInterval(()=>{const h=$('#hold');if(!h||h.hidden)return;const st=$('#stl'),t=L[Math.floor(Date.now()/2400)%L.length]+'…';
  if(st&&t!==last){st.textContent=t;last=t}},500)})();
