<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Void Paradigm · Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050914;--pan:rgba(8,20,34,.82);--ln:rgba(34,211,238,.3);--cy:#22d3ee;--pu:#a855f7;--tx:#e6f4ff;--mu:#7c93ab;--ok:#34d399;--bad:#fb7185;--gold:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px 'JetBrains Mono',ui-monospace,Consolas,monospace;display:flex;flex-direction:column;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
header,main,footer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px clamp(14px,3vw,30px);border-bottom:1px solid rgba(34,211,238,.18);background:rgba(5,9,20,.78);backdrop-filter:blur(6px)}
header h1{margin:0;font:800 clamp(16px,2.8vw,22px) 'Orbitron',sans-serif;letter-spacing:.16em;background:linear-gradient(90deg,#fff,#a5f3fc,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--cy);font-size:10px;letter-spacing:.16em}
main{flex:1;width:min(1200px,100%);margin:0 auto;padding:clamp(14px,3vw,28px)}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:18px;padding:clamp(14px,3vw,22px);margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
input{flex:1;min-width:200px;max-width:380px;background:rgba(2,8,18,.85);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:600 13px 'JetBrains Mono',monospace;padding:11px 13px}
input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.upd{color:var(--mu);font-size:11px}
.row{display:grid;grid-template-columns:54px 1fr 66px 66px 66px 84px;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid rgba(34,211,238,.14);margin-bottom:8px;background:var(--pan)}
.row.h{border:0;background:none;color:var(--mu);font-size:10px;letter-spacing:.1em;padding-bottom:0}
.rk{font:700 18px 'Space Grotesk',sans-serif}.nm{font-weight:700;overflow-wrap:anywhere}.nm small{display:block;color:var(--mu);font-weight:400;margin-top:2px;font-size:11px}
.tot{font:700 17px 'Space Grotesk',sans-serif;color:var(--cy);text-align:right}.lv{text-align:center}
.lm{display:none;grid-column:2/4;color:var(--mu);font-size:11px}
.row.top{border-color:rgba(251,191,36,.5);background:linear-gradient(90deg,rgba(251,191,36,.1),var(--pan))}
.row.idle{opacity:.55}.row.me{outline:2px solid var(--cy)}
.msg{text-align:center;color:var(--mu);padding:26px 0;font-size:13px}
.notice{border:1px solid rgba(168,85,247,.45);background:rgba(168,85,247,.1);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.notice .hl{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.24em;color:#d8b4fe;margin-bottom:6px}
.notice p{margin:0;color:var(--tx);font-size:13.5px;line-height:1.7;white-space:pre-wrap;font-weight:400}
#hold{text-align:center;position:relative;overflow:hidden}
#hold:not([hidden]){animation:hin .6s ease-out}@keyframes hin{from{opacity:0;transform:scale(.97)}}
#hold:before,#hold:after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--cy);opacity:.7}
#hold:before{top:12px;left:12px;border-right:0;border-bottom:0}#hold:after{bottom:12px;right:12px;border-left:0;border-top:0}
.hl{color:var(--cy);font-size:10px;letter-spacing:.3em;margin-bottom:8px}
.pc{font:700 13px 'JetBrains Mono',monospace;letter-spacing:.25em;color:var(--cy);text-shadow:0 0 10px rgba(34,211,238,.7);margin-bottom:12px}
.stl{color:var(--mu);font-size:12px;letter-spacing:.12em;margin:12px 0 0;min-height:18px}
h3.gl{animation:gl 5s infinite}@keyframes gl{0%,91%,100%{text-shadow:none;transform:none}92%{text-shadow:2px 0 #22d3ee,-2px 0 #a855f7;transform:translateX(2px)}94%{text-shadow:-2px 0 #22d3ee,2px 0 #a855f7;transform:translateX(-2px)}96%{text-shadow:none;transform:none}}
.split{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.split .side{position:sticky;top:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
footer{padding:14px clamp(14px,3vw,30px);color:var(--mu);font-size:11px;border-top:1px solid rgba(34,211,238,.12);background:rgba(5,9,20,.75);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
@media(max-width:640px){.row{grid-template-columns:44px 1fr auto}.lv,.row.h .lv{display:none}.lm{display:block}.row.h{grid-template-columns:44px 1fr auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  <div id="noticeWrap" hidden></div>

  <div id="mainContent">
    <div class="bar" id="searchBar">
      <input type="search" id="q" placeholder="Find your team name or ID" aria-label="Search teams">
      <span class="upd" id="upd">Loading…</span>
    </div>

    <div id="splitWrap">
      <div id="list"><p class="msg">Loading scores…</p></div>
      <aside id="annSide" class="card side" hidden>
        <div class="hl">ANNOUNCEMENTS</div>
        <div id="annText" style="white-space:pre-wrap;line-height:1.7;font-size:13.5px"></div>
      </aside>
    </div>
  </div>
</main>

<footer>
  <span>Rank by total score · teams that have not finished a level show a dash</span>
  <span>Auto-refresh every 20s</span>
</footer>

<script>
const $ = s => document.querySelector(s);
const SB = { url: 'https://jbydaklyvepixtzrcgfp.supabase.co/rest/v1', key: 'sb_publishable_z-SnsaEpRt47cE7rOumIwA_DwY3tgJE' };
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function rpc(fn, body) {
  const res = await fetch(`${SB.url}/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB.key, Authorization: `Bearer ${SB.key}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('Server replied ' + res.status);
  return res.json();
}

let T = [];

async function load() {
  try {
    const rows = await rpc('public_scores', {});
    T = Array.isArray(rows) ? rows : [];
    const active = T.filter(t => t.d1 || t.d2 || t.d3).sort((x, y) => y.cum - x.cum || x.id - y.id);
    let prev = null, rank = 0;
    active.forEach((t, i) => {
      if (!prev || t.cum !== prev.cum) rank = i + 1;
      t.rank = rank;
      prev = t;
    });
    T = active.concat(T.filter(t => !(t.d1 || t.d2 || t.d3)).sort((x, y) => x.id - y.id));
    $('#upd').textContent = 'Updated ' + new Date().toLocaleTimeString();
    draw();
  } catch (e) {
    $('#upd').textContent = 'Refresh failed: ' + e.message;
    if (!T.length) $('#list').innerHTML = '<p class="msg">Could not load scores.</p>';
  }
}

function draw() {
  const q = $('#q').value.trim().toLowerCase();
  const v = (d, p) => (d ? p : '—');
  const list = T.filter(t => !q || t.name.toLowerCase().includes(q) || String(t.id) === q);
  if (!list.length) {
    $('#list').innerHTML = '<p class="msg">No team found.</p>';
    return;
  }
  $('#list').innerHTML =
    '<div class="row h"><span>RANK</span><span>TEAM</span><span class="lv">LEVEL 1</span><span class="lv">LEVEL 2</span><span class="lv">LEVEL 3</span><span style="text-align:right">TOTAL</span></div>' +
    list.map(t => `<div class="row${t.rank && t.rank <= 3 ? ' top' : ''}${t.rank ? '' : ' idle'}${q && list.length === 1 ? ' me' : ''}">
      <span class="rk">${t.rank ? (t.rank === 1 ? '🥇' : t.rank === 2 ? '🥈' : t.rank === 3 ? '🥉' : t.rank) : '–'}</span>
      <span class="nm">${esc(t.name)}<small>Team ID ${t.id}</small></span>
      <span class="lv">${v(t.d1, t.p1)}</span>
      <span class="lv">${v(t.d2, t.p2)}</span>
      <span class="lv">${v(t.d3, t.p3)}</span>
      <span class="tot">${t.cum}</span>
      <span class="lm">L1 ${v(t.d1, t.p1)} · L2 ${v(t.d2, t.p2)} · L3 ${v(t.d3, t.p3)}</span>
    </div>`).join('');
}

async function checkState() {
  try {
    const [status, cfg] = await Promise.all([
      rpc('get_status', {}),
      rpc('get_config', {}).catch(() => null)
    ]);
    const hold = (status && status.score) || {};
    const vp = cfg && cfg.vp ? cfg.vp : {};
    const scoreCfg = vp.scoreboard || {};
    const loadingOn = scoreCfg.loading ? scoreCfg.loading.on !== false : true;
    const splitOn = scoreCfg.split ? !!scoreCfg.split.on : false;
    const on = loadingOn && !!hold.on;
    $('#hold').hidden = !on;
    const mainContent = document.getElementById('mainContent');
    if (mainContent) mainContent.hidden = on;
    if (on) {
      const hm = document.getElementById('hm');
      if (hm) hm.textContent = hold.message || 'We are updating the scores. Please wait.';
    }

    // Notice board published from the admin dashboard.
    const notice = vp.notice || (cfg && cfg.vp && cfg.vp.notice);
    const showNotice = !!(notice && notice.on && String(notice.text || '').trim());
    $('#noticeWrap').hidden = !(showNotice && !splitOn);
    if (showNotice && !splitOn) {
      $('#noticeWrap').innerHTML = `<div class="notice"><div class="hl">NOTICE BOARD</div><p>${esc(notice.text)}</p></div>`;
    }

    const splitWrap = $('#splitWrap');
    const annSide = $('#annSide');
    const annText = $('#annText');
    if (splitOn && showNotice) {
      splitWrap.classList.add('split');
      annSide.hidden = false;
      if (annText) annText.textContent = notice.text || '';
    } else {
      splitWrap.classList.remove('split');
      annSide.hidden = true;
    }
  } catch (e) {
    /* keep the last known state */
  }
}

$('#q').oninput = draw;
load(); checkState();
setInterval(load, 3000);
setInterval(checkState, 2000);

/* scrolling rocket status line while held */
setInterval(() => {
  const h = $('#hold');
  if (!h || h.hidden) return;
  const lines = ['Calibrating thrusters', 'Aligning orbit', 'Stabilising signal', 'Syncing mission data'];
  const el = $('#stl');
  if (el) el.textContent = lines[Math.floor(Date.now() / 2400) % lines.length] + '…';
}, 600);

(() => {
  const c = $('#bg'), x = c.getContext('2d');
  let W, H, stars = [];
  const init = () => {
    W = c.width = innerWidth; H = c.height = innerHeight;
    stars = Array.from({ length: Math.floor((W * H) / 7000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .3, p: Math.random() * 6
    }));
  };
  const frame = t => {
    x.clearRect(0, 0, W, H);
    const g = x.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, Math.max(W, H) * .7);
    g.addColorStop(0, '#08142a'); g.addColorStop(1, '#050914');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    stars.forEach(s => {
      x.globalAlpha = .3 + .35 * Math.sin(t / 1000 + s.p);
      x.fillStyle = '#cfe9ff';
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill();
    });
    x.globalAlpha = 1;
    if (!matchMedia('(prefers-reduced-motion:reduce)').matches) requestAnimationFrame(frame);
  };
  addEventListener('resize', init); init(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
