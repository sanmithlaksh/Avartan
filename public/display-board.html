<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Void Paradigm · Display Board</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050914;--pan:rgba(8,20,34,.8);--ln:rgba(34,211,238,.3);--cy:#22d3ee;--pu:#a855f7;--tx:#e6f4ff;--mu:#7c93ab;--gold:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px 'JetBrains Mono',ui-monospace,Consolas,monospace;display:flex;flex-direction:column;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
header,main,footer{position:relative;z-index:1}
header{padding:20px clamp(18px,4vw,40px);border-bottom:1px solid rgba(34,211,238,.18);background:rgba(5,9,20,.75);backdrop-filter:blur(6px);text-align:center}
header h1{margin:0;font:800 clamp(28px,6vw,56px) 'Orbitron',sans-serif;letter-spacing:.2em;background:linear-gradient(90deg,#fff,#a5f3fc,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:8px 0 0;color:var(--cy);font-size:clamp(12px,2vw,16px);letter-spacing:.24em}
main{flex:1;width:min(1600px,98%);margin:0 auto;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:24px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:18px;padding:clamp(18px,4vw,32px)}
.row{display:grid;grid-template-columns:80px 1.6fr 100px 100px 100px 120px;gap:16px;align-items:center;padding:16px 22px;border-radius:14px;border:1px solid rgba(34,211,238,.16);margin-bottom:10px;background:var(--pan)}
.row.h{border:0;background:none;color:var(--mu);font-size:clamp(10px,1.2vw,12px);letter-spacing:.16em;padding-bottom:4px}
.rk{font:800 28px 'Space Grotesk',sans-serif;text-align:center}.nm{font-weight:800;font-size:clamp(18px,2.6vw,26px);overflow-wrap:anywhere}.nm small{display:block;color:var(--mu);font-weight:400;margin-top:4px;font-size:clamp(11px,1.4vw,14px)}
.tot{font:800 26px 'Space Grotesk',sans-serif;color:var(--cy);text-align:right}.lv{text-align:center;font-size:clamp(16px,2vw,22px)}
.row.top{border-color:rgba(251,191,36,.6);background:linear-gradient(90deg,rgba(251,191,36,.14),var(--pan))}
.row.idle{opacity:.5}
.msg{text-align:center;color:var(--mu);padding:40px 0;font-size:clamp(16px,2vw,22px)}
.notice{border:1px solid rgba(168,85,247,.55);background:rgba(168,85,247,.16);border-radius:18px;padding:clamp(18px,4vw,36px);text-align:center}
.notice .hl{font:800 12px 'JetBrains Mono',monospace;letter-spacing:.32em;color:#d8b4fe;margin-bottom:12px}
.notice p{margin:0;color:var(--tx);font-size:clamp(20px,4vw,48px);line-height:1.6;white-space:pre-wrap;font-weight:700}
.split{display:grid;grid-template-columns:2.2fr 1fr;gap:24px;align-items:start}
.split .side{position:sticky;top:24px}
@media(max-width:1100px){.split{grid-template-columns:1fr}.row{grid-template-columns:60px 1fr auto}.lv,.row.h .lv{display:none}}
#hold{position:relative;overflow:hidden;text-align:center}
#hold:not([hidden]){animation:hin .6s ease-out}@keyframes hin{from{opacity:0;transform:scale(.97)}}
#hold:before,#hold:after{content:"";position:absolute;width:28px;height:28px;border:2px solid var(--cy);opacity:.7}
#hold:before{top:16px;left:16px;border-right:0;border-bottom:0}#hold:after{bottom:16px;right:16px;border-left:0;border-top:0}
.hl{color:var(--cy);font-size:clamp(10px,1.6vw,14px);letter-spacing:.36em;margin-bottom:10px}
.stl{color:var(--mu);font-size:clamp(12px,1.8vw,16px);letter-spacing:.18em;margin:16px 0 0;min-height:22px}
h3.gl{animation:gl 5s infinite}@keyframes gl{0%,91%,100%{text-shadow:none;transform:none}92%{text-shadow:3px 0 #22d3ee,-3px 0 #a855f7;transform:translateX(3px)}94%{text-shadow:-3px 0 #22d3ee,3px 0 #a855f7;transform:translateX(-3px)}96%{text-shadow:none;transform:none}}
footer{padding:16px clamp(18px,4vw,40px);color:var(--mu);font-size:clamp(10px,1.4vw,14px);border-top:1px solid rgba(34,211,238,.12);background:rgba(5,9,20,.75);text-align:center;letter-spacing:.18em}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<footer>VOID PARADIGM · DISPLAY BOARD · AUTO-REFRESH</footer>

<script>
const $ = s => document.querySelector(s);
const SB = { url: 'https://jbydaklyvepixtzrcgfp.supabase.co/rest/v1', key: 'sb_publishable_z-SnsaEpRt47cE7rOumIwA_DwY3tgJE' };
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[c]));

async function rpc(fn, body) {
  const res = await fetch(`${SB.url}/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB.key, Authorization: `Bearer ${SB.key}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('Server replied ' + res.status);
  return res.json();
}

let T = [];
async function load() {
  try {
    const rows = await rpc('public_scores', {});
    T = Array.isArray(rows) ? rows : [];
    const active = T.filter(t => t.d1 || t.d2 || t.d3).sort((x,y)=>y.cum-x.cum||x.id-y.id);
    let prev=null,rk=0;
    active.forEach((t,i)=>{ if(!prev||t.cum!==prev.cum)rk=i+1; t.rank=rk; prev=t; });
    T = active.concat(T.filter(t=>!(t.d1||t.d2||t.d3)).sort((x,y)=>x.id-y.id));
    $('#upd').textContent = 'Updated ' + new Date().toLocaleTimeString();
    draw();
  } catch(e) {
    $('#upd').textContent = 'Refresh failed';
    if(!T.length) $('#list').innerHTML = '<p class="msg">Could not load scores.</p>';
  }
}

function draw() {
  const v = (d,p)=> d?p:'—';
  const list = T.slice(0, 20);
  if(!list.length){ $('#list').innerHTML = '<p class="msg">No scores yet</p>'; return; }
  $('#list').innerHTML = '<div class="row h"><span>RANK</span><span>TEAM</span><span class="lv">LEVEL 1</span><span class="lv">LEVEL 2</span><span class="lv">LEVEL 3</span><span style="text-align:right">TOTAL</span></div>' +
    list.map(t=>`<div class="row${t.rank&&t.rank<=3?' top':''}${t.rank?'':' idle'}">
      <span class="rk">${t.rank?(t.rank===1?'🥇':t.rank===2?'🥈':t.rank===3?'🥉':t.rank):'–'}</span>
      <span class="nm">${esc(t.name)}<small>TEAM ID ${t.id}</small></span>
      <span class="lv">${v(t.d1,t.p1)}</span>
      <span class="lv">${v(t.d2,t.p2)}</span>
      <span class="lv">${v(t.d3,t.p3)}</span>
      <span class="tot">${t.cum}</span>
    </div>`).join('');
}

async function checkState() {
  try {
    const [status, cfg] = await Promise.all([rpc('get_status',{}), rpc('get_config',{}).catch(()=>null)]);
    const vp = cfg && cfg.vp ? cfg.vp : {};
    const display = vp.display || {};
    const loadingOn = display.loading ? display.loading.on !== false : (vp.scoreboard && vp.scoreboard.loading ? vp.scoreboard.loading.on !== false : true);
    const showAnn = display.announcements ? !!display.announcements.on : (vp.scoreboard && vp.scoreboard.split ? !!vp.scoreboard.split.on : false);
    const hold = (status && status.score) || {};
    const on = loadingOn && !!hold.on;
    $('#hold').hidden = !on;
    $('#mainContent').hidden = on;
    if(on && $('#hm')) $('#hm').textContent = hold.message || 'We are updating the scores. Please wait.';

    const notice = vp.notice || {};
    const annSide = $('#annSide');
    const annText = $('#annText');
    const splitWrap = $('#splitWrap');
    if(showAnn && notice.on && String(notice.text||'').trim()) {
      splitWrap.classList.add('split');
      annSide.hidden = false;
      if(annText) annText.textContent = notice.text || '';
    } else {
      splitWrap.classList.remove('split');
      annSide.hidden = true;
    }
  } catch(e) {}
}

load(); checkState();
setInterval(load, 8000);
setInterval(checkState, 5000);

(() => {
  const c=$('#bg'),x=c.getContext('2d');let W,H,stars=[];
  const init=()=>{W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:Math.floor(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.4,p:Math.random()*6}));};
  const frame=t=>{x.clearRect(0,0,W,H);const g=x.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.8);g.addColorStop(0,'#08142a');g.addColorStop(1,'#050914');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=.3+.4*Math.sin(t/900+s.p);x.fillStyle='#cfe9ff';x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();});x.globalAlpha=1;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(frame);};
  addEventListener('resize',init);init();requestAnimationFrame(frame);
})();

setInterval(()=>{
  const h=$('#hold'); if(!h||h.hidden)return;
  const lines=['Calibrating thrusters','Aligning orbit','Stabilising signal','Syncing mission data','Awaiting transmission'];
  const el=$('#stl'); if(el) el.textContent = lines[Math.floor(Date.now()/2200)%lines.length]+'…';
},600);
</script>
